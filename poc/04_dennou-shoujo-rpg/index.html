<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>PoC: 電脳少女のRPG — 領域拡大×属性相性の検証</title>
<style>
  body { margin:0; background:#0f1d3e; font-family:"Yu Gothic UI",sans-serif; color:#fff;
         display:flex; flex-direction:column; align-items:center; }
  h1 { font-size:14px; margin:10px 0 2px; color:#fff2ad; }
  #info { font-size:12px; color:#b9a0cb; margin-bottom:6px; }
  #stage { border-radius:10px; overflow:hidden; box-shadow:0 6px 24px rgba(0,0,0,.5); }
  #party { display:flex; gap:8px; margin:10px 0; }
  .unit { padding:7px 16px; border-radius:18px; border:2px solid #5391c8; background:#132a52;
          cursor:pointer; font-size:13px; transition:transform .15s; }
  .unit:hover { transform:translateY(-2px); }
  .unit.sel { background:#5391c8; box-shadow:0 0 12px #5391c8; }
  #log { font-size:13px; color:#fff2ad; min-height:36px; text-align:center; max-width:740px; line-height:1.6; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.4.2/pixi.min.js"></script>
<script src="https://unpkg.com/pixi-filters@5.3.0/dist/browser/pixi-filters.js"></script>
<script src="../common/fx.js"></script>
</head>
<body>
<h1>🌐 電脳少女のRPG PoC — ユニットを選び、隣接セルをクリックして領域拡大</h1>
<div id="info">検証: 属性相性（火→氷→風→土→電→水→火）・電脳グリッチ演出・神社ハブからの拡張（Totten Ch4/12）</div>
<div id="stage"></div>
<div id="party"></div>
<div id="log">⛩ 電脳桜神社から領域を広げよう。敵属性に強いユニットで挑むと必勝</div>
<script>
const W=880,H=430,CELL=62,COLS=13,ROWS=6;
const app=new PIXI.Application({width:W,height:H,background:0x0f1d3e,antialias:true});
document.getElementById('stage').appendChild(app.view);
FX.attach(app, { title:'電脳少女のRPG', sub:'領域拡大×属性相性 — ユニットを選び隣接セルをクリック（Pでピクセル化）',
  accent:0xfff2ad, accent2:0x8a5fa5, bloomThreshold:.5, bloomScale:1.15 });

// 属性: 相性ループ 火>氷>風>土>電>水>火
const ELEM={fire:{n:'火',c:0xea5e75},ice:{n:'氷',c:0x81cde0},wind:{n:'風',c:0xa8d8a0},
            earth:{n:'土',c:0xc9a06c},elec:{n:'電',c:0xf3aecc},water:{n:'水',c:0x5391c8}};
const ORDER=['fire','ice','wind','earth','elec','water'];
function beats(a,b){ return ORDER[(ORDER.indexOf(a)+1)%6]===b; }

// パーティ（txtの属性割当から抜粋）
const PARTY=[{name:'みこち',e:'fire'},{name:'フブキ',e:'ice'},{name:'いろは',e:'wind'},
             {name:'まつり',e:'earth'},{name:'シオン',e:'elec'},{name:'あくあ',e:'water'}];
let selUnit=PARTY[0];
const partyDiv=document.getElementById('party');
PARTY.forEach((u,i)=>{
  const b=document.createElement('button');
  b.className='unit'+(i===0?' sel':'');
  b.innerHTML=`${u.name} <span style="color:#${ELEM[u.e].c.toString(16).padStart(6,'0')}">●${ELEM[u.e].n}</span>`;
  b.onclick=()=>{ selUnit=u; [...partyDiv.children].forEach(c=>c.classList.remove('sel')); b.classList.add('sel'); };
  partyDiv.appendChild(b);
});

// ---- グリッド ----
const grid=[], board=new PIXI.Container();
board.position.set((W-COLS*CELL)/2,(H-ROWS*CELL)/2);
app.stage.addChild(board);
const log=document.getElementById('log');
for(let y=0;y<ROWS;y++){ grid[y]=[];
  for(let x=0;x<COLS;x++){
    const owned=(x===6&&y===3);
    const e=ORDER[Math.floor(Math.random()*6)];
    const c=new PIXI.Container(); c.position.set(x*CELL,y*CELL);
    const g=new PIXI.Graphics(); c.addChild(g);
    const t=new PIXI.Text('',{fontSize:16,fill:0xffffff}); t.anchor.set(.5); t.position.set(CELL/2,CELL/2); c.addChild(t);
    board.addChild(c);
    const cell={x,y,owned,e,g,t,c,hp:20+Math.floor(Math.random()*20),glitch:0};
    c.eventMode='static';
    c.on('pointertap',()=>attack(cell));
    grid[y][x]=cell;
    draw(cell);
  }
}
function hexPath(g,cx,cy,r){
  const pts=[];
  for(let i=0;i<6;i++){ const a=Math.PI/3*i+Math.PI/6; pts.push(cx+Math.cos(a)*r, cy+Math.sin(a)*r); }
  g.drawPolygon(pts);
}
function draw(cell){
  const {g,t}=cell, cx=CELL/2, cy=CELL/2;
  g.clear();
  if(cell.owned){
    // 解放セル: 二重ヘックス＋回路トレース＋桜
    g.beginFill(0x16305e); hexPath(g,cx,cy,27); g.endFill();
    g.beginFill(0x1c3f78); hexPath(g,cx,cy,22); g.endFill();
    g.lineStyle(1.8,0xfff2ad,.9); hexPath(g,cx,cy,27); g.lineStyle(0);
    g.lineStyle(1,0x81cde0,.5);
    for(let i=0;i<6;i+=2){ const a=Math.PI/3*i+Math.PI/6;
      g.moveTo(cx,cy).lineTo(cx+Math.cos(a)*20,cy+Math.sin(a)*20);
      g.drawCircle(cx+Math.cos(a)*20,cy+Math.sin(a)*20,1.6); }
    g.lineStyle(0);
    if(cell.x===6&&cell.y===3){ t.text='⛩'; t.style.fontSize=24; t.position.set(cx,cy); }
    else { t.text=''; FXS.flower(g,0xf3aecc,0xfff2ad,9,5,cell.x*7+cell.y*13,cx,cy); }
  } else {
    // 未解放セル: 暗ヘックス＋属性クリスタル（不定形ファセット）
    g.beginFill(0x0d1430,.95); hexPath(g,cx,cy,27); g.endFill();
    g.lineStyle(1,0x2a3c66,.9); hexPath(g,cx,cy,27); g.lineStyle(0);
    FXS.crystal(g,ELEM[cell.e].c,11,6,cell.x*31+cell.y*17+3,cx,cy-6);
    t.text=ELEM[cell.e].n; t.position.set(cx,cy+17); t.style.fontSize=11;
  }
}
function neighbors(cell){
  return [[0,1],[0,-1],[1,0],[-1,0]].map(([dx,dy])=>grid[cell.y+dy]?.[cell.x+dx]).filter(Boolean);
}
let captured=1;
function attack(cell){
  if(!FX.playing||cell.owned) return;
  if(!neighbors(cell).some(n=>n.owned)){ log.textContent='領域に隣接したセルしか攻められない'; return; }
  const adv=beats(selUnit.e,cell.e), dis=beats(cell.e,selUnit.e);
  const win = adv || (!dis && Math.random()<.6);
  if(win){
    cell.owned=true; cell.glitch=1; captured++;
    burst(cell); draw(cell);
    log.innerHTML=`⚡ <b>${selUnit.name}</b> が ${ELEM[cell.e].n}属性の領域を解放！ ` +
      (adv?`<b style="color:#fff2ad">相性有利（${ELEM[selUnit.e].n}→${ELEM[cell.e].n}）</b>`:'互角の勝負を制した') +
      `　[領域 ${captured}マス]`;
  } else {
    cell.glitch=1;
    log.innerHTML=`💥 敗北… ${ELEM[cell.e].n}属性には <b>${ELEM[ORDER[(ORDER.indexOf(cell.e)+5)%6]].n}</b> が有効（相性ループ）`;
  }
}
// パーティクル
const parts=[];
function burst(cell){
  const cx=board.x+cell.x*CELL+CELL/2, cy=board.y+cell.y*CELL+CELL/2;
  for(let i=0;i<20;i++){
    const g=new PIXI.Graphics();
    g.beginFill(0xfff2ad).drawRect(0,0,3,3).endFill();
    g.position.set(cx,cy);
    const a=Math.random()*Math.PI*2,s=2+Math.random()*4;
    parts.push({g,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1});
    app.stage.addChild(g);
  }
}
// 走査線＋グリッチ（電脳感）
const scan=new PIXI.Graphics(); app.stage.addChild(scan);
app.ticker.add(dt=>{
  for(const p of parts){
    p.g.x+=p.vx*dt; p.g.y+=p.vy*dt; p.life-=.03*dt; p.g.alpha=p.life;
    if(p.life<=0) app.stage.removeChild(p.g);
  }
  parts.splice(0,parts.length,...parts.filter(p=>p.life>0));
  // セルのグリッチ揺れ
  for(const row of grid) for(const cell of row){
    if(cell.glitch>0){
      cell.glitch-=.04*dt;
      cell.c.position.set(cell.x*CELL+(Math.random()-.5)*6*cell.glitch, cell.y*CELL+(Math.random()-.5)*4*cell.glitch);
      if(cell.glitch<=0) cell.c.position.set(cell.x*CELL,cell.y*CELL);
    }
    if(cell.owned && Math.random()<.002*dt){ cell.glitch=.4; } // 領域の明滅ノイズ
  }
  // 走査線
  scan.clear();
  const sy=(performance.now()/18)%H;
  scan.beginFill(0xffffff,.05).drawRect(0,sy,W,2).endFill();
  scan.beginFill(0x81cde0,.03).drawRect(0,(sy+H/2)%H,W,8).endFill();
  // 神社の鼓動
  const shrine=grid[3][6];
  shrine.c.scale.set(1+Math.sin(performance.now()/400)*.03);
});
</script>
</body>
</html>
