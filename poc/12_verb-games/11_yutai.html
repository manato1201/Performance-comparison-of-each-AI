<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>幽体観光 — 供える・漂う・浮かぶ・散る</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E👻%3C/text%3E%3C/svg%3E">
<style>
  body { margin:0; background:#1c1c2e; font-family:"Yu Gothic UI",sans-serif; color:#fff;
         display:flex; flex-direction:column; align-items:center; }
  h1 { font-size:13px; margin:8px 0 4px; color:#e7ebf6; }
  #stage { border-radius:10px; overflow:hidden; box-shadow:0 6px 24px rgba(0,0,0,.5); max-width:100%; }
  #stage canvas { max-width:100%; height:auto; display:block; }
  #hud { font-size:13px; margin:8px; } #hud b { color:#e7ebf6; }
  #gauge { width:170px; height:10px; background:#0e0e1c; border-radius:5px; overflow:hidden;
    display:inline-block; vertical-align:middle; border:1px solid #6b6482; }
  #gauge div { height:100%; background:linear-gradient(90deg,#82a0b3,#e7ebf6); transition:width .15s; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.4.2/pixi.min.js"></script>
<script src="https://unpkg.com/pixi-filters@5.3.0/dist/browser/pixi-filters.js"></script>
<script src="../common/fx.js"></script>
<script src="../common/audio.js"></script>
</head>
<body>
<h1>👻 矢印=移動 / Z=幽体⇔肉体 / X=仏壇で供える（回復）。幽体は壁を抜けるがゲージが尽きると散る。提灯3ヶ所を巡って出口へ</h1>
<div id="stage"></div>
<div id="hud">幽体ゲージ <span id="gauge"><div></div></span>　観光: <b id="spot">0</b> / 3　<span id="tip"></span></div>
<script>
const W=880,H=430;
const app=new PIXI.Application({width:W,height:H,background:0x232338,antialias:true});
document.getElementById('stage').appendChild(app.view);
FX.attach(app,{title:'幽体観光',sub:'供える・漂う・浮かぶ・散る — 長居は、できない旅',
  accent:0xe7ebf6,accent2:0x6b6482,bloomThreshold:.5,onStart:()=>FXA.play('calm')});

// 屋敷（壁ブロック）
const walls=[
  {x:0,y:0,w:W,h:16},{x:0,y:H-16,w:W,h:16},{x:0,y:0,w:16,h:H},{x:W-16,y:0,w:16,h:H},
  {x:180,y:0,w:18,h:280},{x:360,y:150,w:18,h:280},{x:540,y:0,w:18,h:280},{x:700,y:150,w:18,h:280},
];
const wg=new PIXI.Graphics();
for(let i=0;i<14;i++) wg.beginFill(0x232338,1-i*.01).drawRect(0,i*H/14,W,H/14+1).endFill();
for(const w of walls){
  wg.beginFill(0x3c3c47).drawRect(w.x,w.y,w.w,w.h).endFill();
  wg.beginFill(0x52526a,.7).drawRect(w.x,w.y,w.w,4).endFill();
  // 障子の桟
  if(w.h>100) for(let y=w.y+24;y<w.y+w.h-20;y+=36) wg.beginFill(0x2a2a3c).drawRect(w.x+3,y,w.w-6,3).endFill();
}
app.stage.addChild(wg);
function hitWall(x,y){ return walls.some(w=>x>w.x-8&&x<w.x+w.w+8&&y>w.y-8&&y<w.y+w.h+8); }

// 仏壇2ヶ所（ろうそく発光）
const altars=[{x:90,y:340},{x:620,y:80}];
for(const a of altars){
  const g=new PIXI.Graphics();
  g.beginFill(0x4a3a2c).drawRoundedRect(-22,-16,44,28,4).endFill();
  g.beginFill(0x2a2032).drawRoundedRect(-16,-32,32,18,3).endFill();
  FXS.glowOrb(g,0xf4b26b,4.5,0xffffff,-9,-36);
  FXS.glowOrb(g,0xf4b26b,4.5,0xffffff,9,-36);
  g.position.set(a.x,a.y);
  app.stage.addChild(g);
  const t=new PIXI.Text('仏壇 (X=供える)',{fontSize:10,fill:0x9a9ab5});
  t.anchor.set(.5); t.position.set(a.x,a.y+24); app.stage.addChild(t);
}
// 観光スポット3ヶ所（提灯）
const spots=[{x:270,y:80},{x:450,y:360},{x:800,y:70}];
const spotObjs=spots.map((s,i)=>{
  const c=new PIXI.Container();
  const g=new PIXI.Graphics();
  FXS.glowOrb(g,0xe9a3c0,8,0xffffff,0,0);
  g.beginFill(0xc95a7a,.9); g.moveTo(-9,-8); g.bezierCurveTo(-11,4,11,4,9,-8);
  g.bezierCurveTo(8,-16,-8,-16,-9,-8); g.closePath().endFill();
  g.beginFill(0x4a3a2c).drawRect(-4,-18,8,3).drawRect(-4,6,8,3).endFill();
  g.lineStyle(1,0x2a2032,.8).moveTo(-6,-8).lineTo(-6,2).moveTo(0,-10).lineTo(0,4).moveTo(6,-8).lineTo(6,2); g.lineStyle(0);
  c.addChild(g);
  const t=new PIXI.Text('📷',{fontSize:13}); t.anchor.set(.5); t.position.set(0,-28); c.addChild(t);
  c.position.set(s.x,s.y); app.stage.addChild(c);
  return {c,done:false,t:Math.random()*9};
});
// 出口
const exit=new PIXI.Graphics();
FXS.glowOrb(exit,0x82e0c0,10,0xffffff,0,0);
exit.beginFill(0x2a5a4a,.6).drawRoundedRect(-18,-26,36,52,8).endFill();
exit.position.set(830,380); app.stage.addChild(exit);

// 旅人（肉体=着物 / 幽体=半透明グロー）
const hero=new PIXI.Container();
const hg=new PIXI.Graphics(); hero.addChild(hg);
function drawHero(ghost){
  hg.clear();
  if(ghost){
    FXS.glowOrb(hg,0xbfd0e8,14,0xffffff,0,-10);
    hg.beginFill(0xd8e4f4,.75);
    hg.moveTo(-11,-20); hg.bezierCurveTo(-13,4,-6,8,-8,16);
    hg.quadraticCurveTo(-3,10,0,16); hg.quadraticCurveTo(3,10,8,16);
    hg.bezierCurveTo(6,8,13,4,11,-20);
    hg.bezierCurveTo(8,-30,-8,-30,-11,-20); hg.closePath().endFill();
    hg.beginFill(0x3c3c60).drawCircle(-4,-20,1.8).drawCircle(4,-20,1.8).endFill();
  } else {
    hg.beginFill(0x14141f,.35).drawEllipse(0,18,11,3.5).endFill();
    hg.beginFill(0x5d4a6e); // 着物
    hg.moveTo(-10,-14); hg.bezierCurveTo(-14,4,-10,16,0,16);
    hg.bezierCurveTo(10,16,14,4,10,-14); hg.closePath().endFill();
    hg.beginFill(0x8a6a94).drawPolygon([-10,-8,10,-4,10,0,-10,-4]).endFill(); // 帯
    hg.beginFill(0xf0dcc8).drawCircle(0,-22,9).endFill();
    hg.beginFill(0x2a2032); hg.moveTo(-9,-24); hg.bezierCurveTo(-8,-34,8,-34,9,-24);
    hg.quadraticCurveTo(0,-28,-9,-24); hg.closePath().endFill();
    hg.beginFill(0x2a2032).drawCircle(-3,-21,1.5).drawCircle(3,-21,1.5).endFill();
  }
}
drawHero(false);
hero.position.set(60,300); app.stage.addChild(hero);
const P={x:60,y:300};
let ghost=false, gauge=100, photos=0, over=false;
const trail=[];
const tip=document.getElementById('tip');
const keys={};
addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(!FX.playing||over) return;
  if(e.code==='KeyZ'){
    // 肉体に戻る時は壁の中にいないこと
    if(ghost&&hitWall(P.x,P.y)){ tip.textContent='壁の中では実体化できない！'; return; }
    ghost=!ghost; drawHero(ghost); FXA.sfx('ui');
  }
  if(e.code==='KeyX'&&!ghost){
    for(const a of altars){
      if(Math.hypot(a.x-P.x,a.y-P.y)<50){
        gauge=100; FXA.sfx('heal');
        for(let i=0;i<12;i++) burst(a.x,a.y-30,0xf4b26b,1,3);
        tip.textContent='供えた。心が軽くなる';
      }
    }
  }
});
addEventListener('keyup',e=>keys[e.code]=false);
const parts=[];
function burst(x,y,c,n=10,s=3){for(let i=0;i<n;i++){const g=new PIXI.Graphics();
  g.beginFill(c).drawCircle(0,0,2+Math.random()*2.5).endFill(); g.position.set(x,y);
  const a=Math.random()*7; parts.push({g,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1}); app.stage.addChild(g);}}
const flash=new PIXI.Graphics(); app.stage.addChild(flash);
let flashA=0;

app.ticker.add(dt=>{
  if(!FX.playing||over) return;
  const now=performance.now();
  const sp=ghost?3.2:2.6;
  let nx=P.x+(((keys['ArrowRight']?1:0)-(keys['ArrowLeft']?1:0))*sp)*dt;
  let ny=P.y+(((keys['ArrowDown']?1:0)-(keys['ArrowUp']?1:0))*sp)*dt;
  nx=Math.max(24,Math.min(W-24,nx)); ny=Math.max(30,Math.min(H-26,ny));
  if(ghost||!hitWall(nx,ny)){ P.x=nx; P.y=ny; }
  hero.position.set(P.x,P.y+(ghost?Math.sin(now/400)*5:0));
  hero.alpha=ghost?.85:1;
  // 幽体: ゲージ減少＋残像
  if(ghost){
    gauge-=.11*dt;
    if(Math.random()<.3*dt){
      const g=new PIXI.Graphics();
      g.beginFill(0xbfd0e8,.4).drawCircle(0,0,7).endFill();
      g.position.set(P.x,P.y-8); app.stage.addChild(g);
      trail.push({g,life:.6});
    }
    if(gauge<=0){
      over=true; FXA.stop(); FXA.sfx('gameover');
      for(let i=0;i<30;i++) burst(P.x,P.y-10,0xd8e4f4,1,4); // 花弁のように散る
      hero.visible=false;
      FX.result({title:'散……',lines:['長く漂いすぎた','仏壇の供えが、現世との糸だった']});
    }
  } else gauge=Math.min(100,gauge+.02*dt);
  document.querySelector('#gauge div').style.width=Math.max(0,gauge)+'%';
  // 観光スポット（幽体で触れる）
  for(const s of spotObjs){
    s.t+=dt*.04; s.c.y+=Math.sin(s.t*2)*.15*dt;
    if(!s.done&&ghost&&Math.hypot(s.c.x-P.x,s.c.y-P.y)<30){
      s.done=true; photos++; document.getElementById('spot').textContent=photos;
      FXA.sfx('pickup'); flashA=1;
      s.c.getChildAt(1).text='✅';
      tip.textContent='いい写真が撮れた';
    }
  }
  // 出口
  if(photos>=3&&Math.hypot(830-P.x,380-P.y)<36){
    over=true; FXA.sfx('clear');
    FX.result({title:'🏮 観光、満喫',lines:['三つの提灯を巡り、無事に還った',`残ゲージ: ${Math.round(gauge)}%`]});
  }
  // フラッシュ
  flashA=Math.max(0,flashA-.06*dt);
  flash.clear();
  if(flashA>0) flash.beginFill(0xffffff,flashA*.7).drawRect(0,0,W,H).endFill();
  for(const t of trail){ t.life-=.03*dt; t.g.alpha=t.life; t.g.scale.set(1+(0.6-t.life)); if(t.life<=0) app.stage.removeChild(t.g); }
  trail.splice(0,trail.length,...trail.filter(t=>t.life>0));
  for(const p of parts){ p.g.x+=p.vx*dt; p.g.y+=p.vy*dt; p.vy+=.04*dt; p.life-=.02*dt; p.g.alpha=p.life;
    if(p.life<=0) app.stage.removeChild(p.g); }
  parts.splice(0,parts.length,...parts.filter(p=>p.life>0));
});
</script>
</body>
</html>
